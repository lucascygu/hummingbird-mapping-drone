# Generated / assisted by Claude
# Continuous integration for the Hummingbird workspace.
#
#   unit    pure-Python tests, no ROS (seconds)
#   humble  the deployment target's ROS distro: build the pinned stack (Livox-SDK2,
#           livox_ros_driver2, FAST-LIO2, px4_msgs release/1.16, hummingbird_*), run the in-process
#           node tests, then fly the fake Mid-360 through the real mapping chain and score it
#           against ground truth (scripts/sim_e2e_test.sh)
#   docker  builds docker/Dockerfile; manual only (Actions tab -> CI -> Run workflow), it is slow
#
# None of this touches a flight controller: there is no PX4 in the loop.
# Everything runs on x86_64; the Jetson (aarch64) build is still unverified.
name: CI

on:
  push:
    branches: [main]      # other branches are covered by their pull request (avoids running twice)
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests (no ROS)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"   # Ubuntu 22.04 / JetPack 6 system Python
      - run: python -m pip install numpy pyyaml pytest
      - run: bash scripts/run_tests.sh

  humble:
    name: ROS 2 Humble build, node tests, simulated mapping run
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    container:
      image: ros:humble-ros-base
      # Fast DDS shares large messages (point clouds) through /dev/shm; Docker's default 64 MB is too small.
      options: --shm-size=2g
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: System dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git build-essential cmake python3-vcstool python3-colcon-common-extensions \
            python3-numpy python3-yaml python3-pytest libpcl-dev libeigen3-dev \
            ros-humble-pcl-ros ros-humble-pcl-conversions ros-humble-tf2-ros \
            ros-humble-sensor-msgs-py ros-humble-std-srvs ros-humble-nav-msgs

      - name: Livox-SDK2 (pinned fork)
        run: |
          git clone https://github.com/lucascygu/Livox-SDK2.git /tmp/Livox-SDK2
          cd /tmp/Livox-SDK2
          git checkout c0796f04c143143899c87a773d9f6b7136453c0b
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          make -j"$(nproc)"
          make install
          ldconfig

      - name: Import pinned dependencies
        working-directory: ros2_ws
        run: |
          vcs import --recursive src < hummingbird.repos
          # livox_ros_driver2 ships package_ROS1/ROS2.xml; its build.sh normally does this swap.
          cp src/livox_ros_driver2/package_ROS2.xml src/livox_ros_driver2/package.xml
          rm -rf src/livox_ros_driver2/launch
          cp -r src/livox_ros_driver2/launch_ROS2 src/livox_ros_driver2/launch

      - name: Build
        working-directory: ros2_ws
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --symlink-install --event-handlers console_cohesion+ \
            --cmake-args -DCMAKE_BUILD_TYPE=Release -DROS_EDITION=ROS2 -DDISTRO_ROS=humble

      - name: Node tests
        working-directory: ros2_ws
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          colcon test --return-code-on-test-failure --event-handlers console_direct+ \
            --packages-select hummingbird_task_agent hummingbird_px4_bridge hummingbird_bringup

      - name: Simulated mapping run, scored against ground truth
        run: |
          source /opt/ros/humble/setup.bash
          source ros2_ws/install/setup.bash
          bash scripts/sim_e2e_test.sh

      - name: Keep logs when something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: humble-logs
          path: |
            ros2_ws/log
            /tmp/hummingbird_sim_*
          if-no-files-found: ignore

  docker:
    name: Docker image (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/Dockerfile -t hummingbird:humble .
      - name: Unit tests inside the image
        run: |
          docker run --rm -v "$PWD":/repo -w /repo hummingbird:humble bash scripts/run_tests.sh
