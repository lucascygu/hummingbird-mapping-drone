<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f5ee">
  <title>Oprace · 越野样品接力</title>
  <style>
    :root {color-scheme:light;--paper:#f5f5ee;--white:#fffffb;--ink:#172e29;--muted:#526861;--line:#cdd5cc;--green:#165742;--amber:#ac7029;--mono:"IBM Plex Mono",Consolas,monospace}
    * {box-sizing:border-box}
    body {margin:0;background:var(--paper);color:var(--ink);font-family:"Instrument Sans","Noto Sans CJK SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;font-size:15px}
    button,select {font:inherit;color:inherit}
    button,select,summary {cursor:pointer}
    button:focus-visible,select:focus-visible,summary:focus-visible {outline:3px solid #a26a23;outline-offset:3px}
    button:disabled {cursor:default;opacity:.43}
    .shell {max-width:1220px;margin:auto;padding:0 clamp(16px,4vw,56px) 26px}
    .brandbar {display:flex;justify-content:space-between;align-items:center;padding:17px 0 13px;border-bottom:1px solid var(--line);gap:12px}
    .wordmark {font:700 23px/1.05 "Instrument Sans",Arial,sans-serif;letter-spacing:-1.5px}
    .brand-detail {margin-left:13px;padding-left:12px;border-left:1px solid #aebbb1;font-size:12px;color:var(--muted);letter-spacing:.08em}
    .mode {display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--muted)}
    .mode::before {content:"";width:7px;height:7px;border-radius:50%;background:#4d886b}
    header {padding:22px 0 18px}
    h1,h2,h3,p {margin:0}
    h1 {font-size:clamp(28px,3.6vw,45px);line-height:1.28;font-weight:720;letter-spacing:-.045em}
    .intro {margin-top:7px;color:var(--muted);font-size:14px;line-height:1.65}
    .settings {display:flex;flex-wrap:wrap;gap:10px 23px;margin-bottom:15px}
    .settings label {display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
    select {background:var(--white);border:1px solid #b8c6bd;border-radius:5px;padding:6px 5px 6px 9px;font-size:13px;font-weight:500}
    .workspace {display:grid;grid-template-columns:minmax(0,2.1fr) minmax(255px,.89fr);gap:14px;align-items:start}
    .mapcard,.panel {border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--white)}
    .maphead {display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;background:#183831;color:#e4e9dc;border-bottom:1px solid #37524c}
    h2 {font-size:16px;line-height:1.45;letter-spacing:-.02em}
    .maphead .mapversion {color:#c5d7cb;font:12px/1.5 var(--mono)}
    canvas {display:block;width:100%;aspect-ratio:1.88;background:#132f29}
    .legend {display:flex;flex-wrap:wrap;gap:6px 14px;padding:7px 15px 9px;background:#183831;color:#dce8d9;font-size:11.5px}
    .legend span {display:inline-flex;align-items:center;gap:5px}
    .swatch {display:inline-block;width:16px;border-top:2px solid}
    .swatch.duck {border-color:#f6c16c}
    .swatch.bird {border-color:#74ddd0}
    .swatch.plan {border-color:#d8e7c6;border-top-style:dashed}
    .unknown {font:700 12px var(--mono);color:#d8e7c6}
    .current {padding:15px 16px 10px;min-height:79px}
    .current h3 {font-size:17px;line-height:1.45}
    .current p {color:var(--muted);font-size:13px;line-height:1.6;margin-top:3px}
    .controls {display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:5px 16px 14px}
    .buttons {display:flex;gap:6px}
    button {border:1px solid #bac8bf;border-radius:5px;background:var(--white);min-height:35px;padding:5px 11px;font-size:13px;font-weight:550}
    button:hover:enabled {border-color:var(--green)}
    button.primary {background:var(--green);color:white;border-color:var(--green);min-width:93px}
    [hidden] {display:none !important}
    .counter {font:12px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
    .panel section {padding:15px 15px 17px;border-bottom:1px solid var(--line)}
    .panel section:last-child {border:0}
    .cardtop,.loghead,.owner {display:flex;align-items:center;justify-content:space-between;gap:10px}
    .sample-id {font:600 14px var(--mono);color:var(--green);letter-spacing:.01em}
    .owner {margin:11px 0 7px}
    .owner small {color:var(--muted);font-size:12px}
    .owner strong {font-size:16px}
    .custody {display:flex;margin:12px 0 0;padding:0;list-style:none}
    .custody li {position:relative;display:flex;flex:1;flex-direction:column;align-items:center;gap:4px;color:var(--muted);font-size:11px;white-space:nowrap}
    .custody li::before {content:"";width:8px;height:8px;z-index:1;border:1.5px solid #b3c1b6;background:var(--white);border-radius:50%}
    .custody li::after {content:"";position:absolute;right:50%;left:-50%;top:4px;height:1.5px;background:#c7d0c9}
    .custody li:first-child::after {display:none}
    .custody .visited::after,.custody .visited::before {background:#54927c;border-color:#54927c}
    .custody .active {font-weight:750;color:var(--green)}
    .custody .active::before {outline:2px solid #b6cfba;outline-offset:2px;background:var(--green)}
    .metrics {display:grid;grid-template-columns:repeat(3,1fr);margin:12px 0 0;gap:5px}
    .metrics dt {font-size:11.5px;color:var(--muted)}
    .metrics dd {margin:3px 0 0;font:600 19px var(--mono);letter-spacing:-1px;white-space:nowrap}
    .metrics dd span {font:12px sans-serif;margin-left:2px}
    .loghead button {font-size:12px;min-height:28px;padding:2px 8px}
    .loglist {list-style:none;margin:9px 0 0;padding:0;height:137px;overflow:auto;scrollbar-width:thin}
    .loglist li {display:grid;grid-template-columns:43px minmax(0,1fr);align-items:baseline;gap:4px;padding:4px 0;font-size:12px;line-height:1.45}
    .loglist time {font:11px var(--mono);color:var(--muted)}
    .loglist li:first-child {font-weight:650}
    .note {font-size:12px;line-height:1.7;color:var(--muted);margin:14px 0 0}
    @media (min-width:1200px) {.panel section {padding:18px}.loglist {height:170px}}
    @media (max-width:820px) {.workspace {grid-template-columns:minmax(0,1fr)}.panel {display:grid;grid-template-columns:1fr 1fr}.panel section {border:none}.panel section:nth-child(2) {border-left:1px solid var(--line)}.panel section:last-child {grid-column:1/-1;border-top:1px solid var(--line)}.loglist {height:90px}.current {min-height:67px}}
    @media (max-width:540px) {.shell {padding:0 12px 18px}.brandbar {padding:12px 0 10px}.brand-detail {margin-left:8px;padding-left:8px}.mode,.brand-detail {font-size:11px}header {padding:14px 0 11px}.intro {font-size:12.5px;margin-top:4px}.settings {gap:8px 12px;margin-bottom:10px}.settings label {gap:4px;font-size:12px}select {font-size:12px;padding:5px 3px}.maphead {padding:8px 12px}.maphead h2 {font-size:14px}canvas {aspect-ratio:1.56}.legend {gap:6px 9px;font-size:10.5px;padding:6px 10px}.swatch{width:12px}.current {padding:11px 12px 5px;min-height:72px}.current h3 {font-size:15px}.current p {font-size:12px}.controls {padding:5px 12px 11px}.panel {display:block}.panel section {padding:12px 14px}.panel section:nth-child(2),.panel section:last-child {border:0;border-top:1px solid var(--line)}.metrics {margin-top:7px}.loglist {height:100px}.note {margin-top:9px}}
  </style>
</head>
<body>
<main class="shell">
  <div class="brandbar"><div><span class="wordmark">Oprace</span><span class="brand-detail">蜂鸟 × 小鸭子</span></div><span id="mode" class="mode">二维任务仿真</span></div>
  <header><h1>桌底取件，跨沟交付</h1><p class="intro">小鸭子把样品从低棚取到 H 垫，蜂鸟接件后飞到断路另一侧。换个路口，看它们怎么改道。</p></header>
  <div class="settings">
    <label>地面路况 <select id="layout"><option value="south">南口通行</option><option value="north">北口通行</option><option value="both">双口通行</option><option value="closed">双口封闭</option><option value="cover">棚内封闭</option><option value="field">现场手动回报</option></select></label>
    <label>观察方式 <select id="policy"><option value="B2">B2 · 按需问路</option><option value="B1">B1 · 固定巡看</option><option value="B0">B0 · 小鸭子自探</option></select></label>
  </div>
  <div class="workspace">
    <article class="mapcard">
      <div class="maphead"><h2>共享场地图</h2><span id="version" class="mapversion">MAP 00</span></div>
      <canvas id="map" role="img" aria-label="场地图。样品位于左侧低棚，交接垫在中间，收件台在断路右侧。">场地图的观测、路径和交付状态同步显示在任务记录中。</canvas>
      <div class="legend" aria-label="图例"><span><i class="swatch duck"></i>小鸭子轨迹</span><span><i class="swatch bird"></i>蜂鸟轨迹</span><span><i class="swatch plan"></i>候选路线</span><span><b class="unknown">?</b> 待观察</span></div>
      <div class="current" role="status"><h3 id="event-title"></h3><p id="event-detail"></p></div>
      <div class="controls"><div class="buttons"><button id="play" class="primary">开始演示</button><button id="step">单步</button><button id="pass" hidden>通行</button><button id="block" hidden>封闭</button><button id="reset">重置</button></div><span id="counter" class="counter"></span></div>
    </article>
    <aside class="panel">
      <section><div class="cardtop"><h2>样品交接</h2><span class="sample-id">HB-01</span></div><div class="owner"><small>样品位置</small><strong id="owner" aria-live="polite">样品架</strong></div>
        <ol class="custody" id="custody"><li>样品架</li><li>小鸭子</li><li>H 垫</li><li>蜂鸟</li><li>收件台</li></ol>
      </section>
      <section><h2>本轮读数</h2><dl class="metrics"><div><dt id="clock-label">模拟用时</dt><dd><b id="time">0.0</b><span>s</span></dd></div><div><dt id="distance-label">地面里程</dt><dd><b id="metres">0.0</b><span>m</span></dd></div><div><dt>空中观察</dt><dd><b id="reads">0</b><span>次</span></dd></div></dl></section>
      <section><div class="loghead"><h2>事件记录</h2><button id="export">导出 JSON</button></div><ol class="loglist" id="log"></ol></section>
    </aside>
  </div>
  <p class="note" id="note">地图采用预设走廊。路口由模拟观察逐一确认，棚内只能由小鸭子查看。距离和时间均来自模型。</p>
</main>
<script src="relay.js"></script>
<script src="view.js"></script>
</body>
</html>
